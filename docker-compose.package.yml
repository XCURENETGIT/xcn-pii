x-json-logging: &json-logging
  driver: json-file
  options:
    max-size: "${PII_DOCKER_LOG_MAX_SIZE:-100m}"
    max-file: "${PII_DOCKER_LOG_MAX_FILE:-5}"

x-http-api-base: &http-api-base
  image: ${PII_IMAGE_REPO:-xcn-pii}/api-http-${PII_RUNTIME_BACKEND:-cpu}:${PII_IMAGE_TAG:-latest}
  command: ["sh", "-c", "uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${UVICORN_WORKERS:-1}"]
  environment:
    - TZ=Asia/Seoul
    - PII_LOG_TIMEZONE=Asia/Seoul
    - PII_LOG_DIR=/logs
    - PII_LOG_LEVEL=${PII_LOG_LEVEL:-INFO}
    - PII_FILE_LOG_ENABLED=true
    - PII_STAGE_TIMING_ENABLED=${PII_STAGE_TIMING_ENABLED:-false}
    - PII_LOG_REQUEST_TEXT_ENABLED=${PII_LOG_REQUEST_TEXT_ENABLED:-false}
    - PII_LOG_REQUEST_TEXT_LIMIT=${PII_LOG_REQUEST_TEXT_LIMIT:-240}
    - PII_LOG_REQUEST_TEXT_REDACT_SENSITIVE=${PII_LOG_REQUEST_TEXT_REDACT_SENSITIVE:-true}
    - PII_STAGE_LOG_ENABLED=${PII_STAGE_LOG_ENABLED:-false}
    - PII_TRACE_DETECT=${PII_TRACE_DETECT:-false}
    - PII_TRACE_SLOW_MS=${PII_TRACE_SLOW_MS:-800}
    - PII_MIN_SCORE=${PII_MIN_SCORE:-0.6}
    - PII_MAX_SPANS=${PII_MAX_SPANS:-200}
    - PII_EMBED_DEVICE=${PII_EMBED_DEVICE:-cpu}
    - PII_HF_OFFLINE=true
    - HF_HUB_OFFLINE=1
    - TRANSFORMERS_OFFLINE=1
    - HF_DATASETS_OFFLINE=1
    - HF_HUB_DISABLE_TELEMETRY=1
    - HF_HOME=/data/hf
    - TRANSFORMERS_CACHE=/data/hf/transformers
    - SENTENCE_TRANSFORMERS_HOME=/data/hf/sentence_transformers
    - PII_CONTEXT_EMBED_MAX_CHARS=${PII_CONTEXT_EMBED_MAX_CHARS:-256}
    - PII_CONTEXT_EMBED_NORMALIZE_DIGITS=${PII_CONTEXT_EMBED_NORMALIZE_DIGITS:-true}
    - PII_CONTEXT_RULE_FIRST_ENABLED=${PII_CONTEXT_RULE_FIRST_ENABLED:-true}
    - PII_FASTPATH_ENABLED=${PII_FASTPATH_ENABLED:-true}
    - PII_FASTPATH_TEXT_LEN=${PII_FASTPATH_TEXT_LEN:-50000}
    - PII_SPLIT_ENABLED=${PII_SPLIT_ENABLED:-true}
    - PII_SPLIT_TEXT_LEN=${PII_SPLIT_TEXT_LEN:-50000}
    - PII_SPLIT_CHUNK_CHARS=${PII_SPLIT_CHUNK_CHARS:-50000}
    - PII_SPLIT_OVERLAP_CHARS=${PII_SPLIT_OVERLAP_CHARS:-2000}
    - PII_SPLIT_MAX_CHUNKS=${PII_SPLIT_MAX_CHUNKS:-64}
    - PII_SPLIT_MAX_WORKERS=${PII_SPLIT_MAX_WORKERS:-1}
    - PII_MODEL_PRELOAD_ENABLED=${PII_MODEL_PRELOAD_ENABLED:-true}
    - PII_STAGE_TIMING_LEVEL=${PII_STAGE_TIMING_LEVEL:-INFO}
    - PII_LOG_SERVICE_NAME=api-http
  volumes:
    - hf_cache:/data/hf
    - ./data:/app/data
    - ./logs:/logs
  logging: *json-logging
  restart: unless-stopped

services:
  api-http:
    <<: *http-api-base
    profiles: ["http"]
    container_name: xcn-pii-api-http
    ports:
      - "${PII_HTTP_PORT:-8005}:8000"

  api-https:
    <<: *http-api-base
    profiles: ["https"]
    container_name: xcn-pii-api-https
    expose:
      - "8000"

  api-grpc-1: &grpc-api-base
    profiles: ["grpc"]
    image: ${PII_IMAGE_REPO:-xcn-pii}/api-grpc-${PII_RUNTIME_BACKEND:-cpu}:${PII_IMAGE_TAG:-latest}
    command: ["python", "-m", "app.grpc_server"]
    container_name: xcn-pii-api-grpc-1
    hostname: grpc-1
    expose:
      - "50051"
    environment:
      - TZ=Asia/Seoul
      - PII_LOG_TIMEZONE=Asia/Seoul
      - PII_LOG_DIR=/logs
      - PII_LOG_LEVEL=${PII_LOG_LEVEL:-INFO}
      - PII_FILE_LOG_ENABLED=true
      - PII_STAGE_TIMING_ENABLED=${PII_STAGE_TIMING_ENABLED:-false}
      - PII_LOG_REQUEST_TEXT_ENABLED=${PII_LOG_REQUEST_TEXT_ENABLED:-false}
      - PII_LOG_REQUEST_TEXT_LIMIT=${PII_LOG_REQUEST_TEXT_LIMIT:-240}
      - PII_LOG_REQUEST_TEXT_REDACT_SENSITIVE=${PII_LOG_REQUEST_TEXT_REDACT_SENSITIVE:-true}
      - PII_STAGE_LOG_ENABLED=${PII_STAGE_LOG_ENABLED:-false}
      - PII_TRACE_DETECT=${PII_TRACE_DETECT:-false}
      - PII_TRACE_SLOW_MS=${PII_TRACE_SLOW_MS:-800}
      - PII_MIN_SCORE=${PII_MIN_SCORE:-0.6}
      - PII_MAX_SPANS=${PII_MAX_SPANS:-200}
      - PII_GRPC_HOST=0.0.0.0
      - PII_GRPC_PORT=50051
      - PII_GRPC_MAX_WORKERS=${PII_GRPC_MAX_WORKERS:-7}
      - PII_GRPC_MAX_CONCURRENT_RPCS=${PII_GRPC_MAX_CONCURRENT_RPCS:-0}
      - PII_GRPC_MAX_CONCURRENT_STREAMS=${PII_GRPC_MAX_CONCURRENT_STREAMS:-1024}
      - PII_GRPC_KEEPALIVE_TIME_MS=${PII_GRPC_KEEPALIVE_TIME_MS:-30000}
      - PII_GRPC_KEEPALIVE_TIMEOUT_MS=${PII_GRPC_KEEPALIVE_TIMEOUT_MS:-10000}
      - PII_GRPC_SO_REUSEPORT=${PII_GRPC_SO_REUSEPORT:-true}
      - PII_DETECT_TIMEOUT_SEC=${PII_DETECT_TIMEOUT_SEC:-10}
      - PII_DETECT_PROCESS_WORKERS=${PII_DETECT_PROCESS_WORKERS:-4}
      - PII_DETECT_QUEUE_LIMIT=${PII_DETECT_QUEUE_LIMIT:-1}
      - PII_DETECT_PROCESS_START_METHOD=${PII_DETECT_PROCESS_START_METHOD:-spawn}
      - PII_DETECT_WORKER_TORCH_THREADS=${PII_DETECT_WORKER_TORCH_THREADS:-1}
      - PII_EMBED_DEVICE=${PII_EMBED_DEVICE:-cpu}
      - PII_HF_OFFLINE=true
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - HF_DATASETS_OFFLINE=1
      - HF_HUB_DISABLE_TELEMETRY=1
      - HF_HOME=/data/hf
      - TRANSFORMERS_CACHE=/data/hf/transformers
      - SENTENCE_TRANSFORMERS_HOME=/data/hf/sentence_transformers
      - PII_CONTEXT_EMBED_MAX_CHARS=${PII_CONTEXT_EMBED_MAX_CHARS:-256}
      - PII_CONTEXT_EMBED_NORMALIZE_DIGITS=${PII_CONTEXT_EMBED_NORMALIZE_DIGITS:-true}
      - PII_CONTEXT_RULE_FIRST_ENABLED=${PII_CONTEXT_RULE_FIRST_ENABLED:-true}
      - PII_FASTPATH_ENABLED=${PII_FASTPATH_ENABLED:-true}
      - PII_FASTPATH_TEXT_LEN=${PII_FASTPATH_TEXT_LEN:-50000}
      - PII_SPLIT_ENABLED=${PII_SPLIT_ENABLED:-true}
      - PII_SPLIT_TEXT_LEN=${PII_SPLIT_TEXT_LEN:-50000}
      - PII_SPLIT_CHUNK_CHARS=${PII_SPLIT_CHUNK_CHARS:-50000}
      - PII_SPLIT_OVERLAP_CHARS=${PII_SPLIT_OVERLAP_CHARS:-2000}
      - PII_SPLIT_MAX_CHUNKS=${PII_SPLIT_MAX_CHUNKS:-64}
      - PII_SPLIT_MAX_WORKERS=${PII_SPLIT_MAX_WORKERS:-1}
      - PII_MODEL_PRELOAD_ENABLED=${PII_MODEL_PRELOAD_ENABLED:-true}
      - PII_STAGE_TIMING_LEVEL=${PII_STAGE_TIMING_LEVEL:-INFO}
      - PII_LOG_FILE_NAME=pii-api-grpc-1.log
    volumes:
      - hf_cache:/data/hf
      - ./data:/app/data
      - ./logs:/logs
    networks:
      default:
        aliases:
          - api-grpc
    logging: *json-logging
    restart: unless-stopped

  api-grpc-2:
    <<: *grpc-api-base
    container_name: xcn-pii-api-grpc-2
    hostname: grpc-2
    environment:
      - TZ=Asia/Seoul
      - PII_LOG_TIMEZONE=Asia/Seoul
      - PII_LOG_DIR=/logs
      - PII_LOG_LEVEL=${PII_LOG_LEVEL:-INFO}
      - PII_FILE_LOG_ENABLED=true
      - PII_STAGE_TIMING_ENABLED=${PII_STAGE_TIMING_ENABLED:-false}
      - PII_LOG_REQUEST_TEXT_ENABLED=${PII_LOG_REQUEST_TEXT_ENABLED:-false}
      - PII_LOG_REQUEST_TEXT_LIMIT=${PII_LOG_REQUEST_TEXT_LIMIT:-240}
      - PII_LOG_REQUEST_TEXT_REDACT_SENSITIVE=${PII_LOG_REQUEST_TEXT_REDACT_SENSITIVE:-true}
      - PII_STAGE_LOG_ENABLED=${PII_STAGE_LOG_ENABLED:-false}
      - PII_TRACE_DETECT=${PII_TRACE_DETECT:-false}
      - PII_TRACE_SLOW_MS=${PII_TRACE_SLOW_MS:-800}
      - PII_MIN_SCORE=${PII_MIN_SCORE:-0.6}
      - PII_MAX_SPANS=${PII_MAX_SPANS:-200}
      - PII_GRPC_HOST=0.0.0.0
      - PII_GRPC_PORT=50051
      - PII_GRPC_MAX_WORKERS=${PII_GRPC_MAX_WORKERS:-7}
      - PII_GRPC_MAX_CONCURRENT_RPCS=${PII_GRPC_MAX_CONCURRENT_RPCS:-0}
      - PII_GRPC_MAX_CONCURRENT_STREAMS=${PII_GRPC_MAX_CONCURRENT_STREAMS:-1024}
      - PII_GRPC_KEEPALIVE_TIME_MS=${PII_GRPC_KEEPALIVE_TIME_MS:-30000}
      - PII_GRPC_KEEPALIVE_TIMEOUT_MS=${PII_GRPC_KEEPALIVE_TIMEOUT_MS:-10000}
      - PII_GRPC_SO_REUSEPORT=${PII_GRPC_SO_REUSEPORT:-true}
      - PII_DETECT_TIMEOUT_SEC=${PII_DETECT_TIMEOUT_SEC:-10}
      - PII_DETECT_PROCESS_WORKERS=${PII_DETECT_PROCESS_WORKERS:-4}
      - PII_DETECT_QUEUE_LIMIT=${PII_DETECT_QUEUE_LIMIT:-1}
      - PII_DETECT_PROCESS_START_METHOD=${PII_DETECT_PROCESS_START_METHOD:-spawn}
      - PII_DETECT_WORKER_TORCH_THREADS=${PII_DETECT_WORKER_TORCH_THREADS:-1}
      - PII_EMBED_DEVICE=${PII_EMBED_DEVICE:-cpu}
      - PII_HF_OFFLINE=true
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - HF_DATASETS_OFFLINE=1
      - HF_HUB_DISABLE_TELEMETRY=1
      - HF_HOME=/data/hf
      - TRANSFORMERS_CACHE=/data/hf/transformers
      - SENTENCE_TRANSFORMERS_HOME=/data/hf/sentence_transformers
      - PII_CONTEXT_EMBED_MAX_CHARS=${PII_CONTEXT_EMBED_MAX_CHARS:-256}
      - PII_CONTEXT_EMBED_NORMALIZE_DIGITS=${PII_CONTEXT_EMBED_NORMALIZE_DIGITS:-true}
      - PII_CONTEXT_RULE_FIRST_ENABLED=${PII_CONTEXT_RULE_FIRST_ENABLED:-true}
      - PII_FASTPATH_ENABLED=${PII_FASTPATH_ENABLED:-true}
      - PII_FASTPATH_TEXT_LEN=${PII_FASTPATH_TEXT_LEN:-50000}
      - PII_SPLIT_ENABLED=${PII_SPLIT_ENABLED:-true}
      - PII_SPLIT_TEXT_LEN=${PII_SPLIT_TEXT_LEN:-50000}
      - PII_SPLIT_CHUNK_CHARS=${PII_SPLIT_CHUNK_CHARS:-50000}
      - PII_SPLIT_OVERLAP_CHARS=${PII_SPLIT_OVERLAP_CHARS:-2000}
      - PII_SPLIT_MAX_CHUNKS=${PII_SPLIT_MAX_CHUNKS:-64}
      - PII_SPLIT_MAX_WORKERS=${PII_SPLIT_MAX_WORKERS:-1}
      - PII_MODEL_PRELOAD_ENABLED=${PII_MODEL_PRELOAD_ENABLED:-true}
      - PII_STAGE_TIMING_LEVEL=${PII_STAGE_TIMING_LEVEL:-INFO}
      - PII_LOG_FILE_NAME=pii-api-grpc-2.log

  api-grpc-3:
    <<: *grpc-api-base
    container_name: xcn-pii-api-grpc-3
    hostname: grpc-3
    environment:
      - TZ=Asia/Seoul
      - PII_LOG_TIMEZONE=Asia/Seoul
      - PII_LOG_DIR=/logs
      - PII_LOG_LEVEL=${PII_LOG_LEVEL:-INFO}
      - PII_FILE_LOG_ENABLED=true
      - PII_STAGE_TIMING_ENABLED=${PII_STAGE_TIMING_ENABLED:-false}
      - PII_LOG_REQUEST_TEXT_ENABLED=${PII_LOG_REQUEST_TEXT_ENABLED:-false}
      - PII_LOG_REQUEST_TEXT_LIMIT=${PII_LOG_REQUEST_TEXT_LIMIT:-240}
      - PII_LOG_REQUEST_TEXT_REDACT_SENSITIVE=${PII_LOG_REQUEST_TEXT_REDACT_SENSITIVE:-true}
      - PII_STAGE_LOG_ENABLED=${PII_STAGE_LOG_ENABLED:-false}
      - PII_TRACE_DETECT=${PII_TRACE_DETECT:-false}
      - PII_TRACE_SLOW_MS=${PII_TRACE_SLOW_MS:-800}
      - PII_MIN_SCORE=${PII_MIN_SCORE:-0.6}
      - PII_MAX_SPANS=${PII_MAX_SPANS:-200}
      - PII_GRPC_HOST=0.0.0.0
      - PII_GRPC_PORT=50051
      - PII_GRPC_MAX_WORKERS=${PII_GRPC_MAX_WORKERS:-7}
      - PII_GRPC_MAX_CONCURRENT_RPCS=${PII_GRPC_MAX_CONCURRENT_RPCS:-0}
      - PII_GRPC_MAX_CONCURRENT_STREAMS=${PII_GRPC_MAX_CONCURRENT_STREAMS:-1024}
      - PII_GRPC_KEEPALIVE_TIME_MS=${PII_GRPC_KEEPALIVE_TIME_MS:-30000}
      - PII_GRPC_KEEPALIVE_TIMEOUT_MS=${PII_GRPC_KEEPALIVE_TIMEOUT_MS:-10000}
      - PII_GRPC_SO_REUSEPORT=${PII_GRPC_SO_REUSEPORT:-true}
      - PII_DETECT_TIMEOUT_SEC=${PII_DETECT_TIMEOUT_SEC:-10}
      - PII_DETECT_PROCESS_WORKERS=${PII_DETECT_PROCESS_WORKERS:-4}
      - PII_DETECT_QUEUE_LIMIT=${PII_DETECT_QUEUE_LIMIT:-1}
      - PII_DETECT_PROCESS_START_METHOD=${PII_DETECT_PROCESS_START_METHOD:-spawn}
      - PII_DETECT_WORKER_TORCH_THREADS=${PII_DETECT_WORKER_TORCH_THREADS:-1}
      - PII_EMBED_DEVICE=${PII_EMBED_DEVICE:-cpu}
      - PII_HF_OFFLINE=true
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - HF_DATASETS_OFFLINE=1
      - HF_HUB_DISABLE_TELEMETRY=1
      - HF_HOME=/data/hf
      - TRANSFORMERS_CACHE=/data/hf/transformers
      - SENTENCE_TRANSFORMERS_HOME=/data/hf/sentence_transformers
      - PII_CONTEXT_EMBED_MAX_CHARS=${PII_CONTEXT_EMBED_MAX_CHARS:-256}
      - PII_CONTEXT_EMBED_NORMALIZE_DIGITS=${PII_CONTEXT_EMBED_NORMALIZE_DIGITS:-true}
      - PII_CONTEXT_RULE_FIRST_ENABLED=${PII_CONTEXT_RULE_FIRST_ENABLED:-true}
      - PII_FASTPATH_ENABLED=${PII_FASTPATH_ENABLED:-true}
      - PII_FASTPATH_TEXT_LEN=${PII_FASTPATH_TEXT_LEN:-50000}
      - PII_SPLIT_ENABLED=${PII_SPLIT_ENABLED:-true}
      - PII_SPLIT_TEXT_LEN=${PII_SPLIT_TEXT_LEN:-50000}
      - PII_SPLIT_CHUNK_CHARS=${PII_SPLIT_CHUNK_CHARS:-50000}
      - PII_SPLIT_OVERLAP_CHARS=${PII_SPLIT_OVERLAP_CHARS:-2000}
      - PII_SPLIT_MAX_CHUNKS=${PII_SPLIT_MAX_CHUNKS:-64}
      - PII_SPLIT_MAX_WORKERS=${PII_SPLIT_MAX_WORKERS:-1}
      - PII_MODEL_PRELOAD_ENABLED=${PII_MODEL_PRELOAD_ENABLED:-true}
      - PII_STAGE_TIMING_LEVEL=${PII_STAGE_TIMING_LEVEL:-INFO}
      - PII_LOG_FILE_NAME=pii-api-grpc-3.log

  api-grpc-lb:
    profiles: ["grpc"]
    image: haproxy:3.1-alpine
    container_name: xcn-pii-grpc-lb
    depends_on:
      - api-grpc-1
      - api-grpc-2
      - api-grpc-3
    ports:
      - "${PII_GRPC_LB_PORT:-50055}:50051"
    volumes:
      - ./infra/haproxy/grpc-lb.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    logging: *json-logging
    restart: unless-stopped

  logrotate:
    profiles: ["http", "https", "grpc"]
    image: ${PII_IMAGE_REPO:-xcn-pii}/api-grpc-${PII_RUNTIME_BACKEND:-cpu}:${PII_IMAGE_TAG:-latest}
    container_name: xcn-pii-logrotate
    command: ["python", "-m", "app.logrotate"]
    environment:
      - TZ=Asia/Seoul
      - PII_LOG_DIR=/logs
      - PII_LOG_LEVEL=${PII_LOG_LEVEL:-INFO}
      - PII_LOG_MAX_FILE_MB=${PII_LOG_MAX_FILE_MB:-100}
      - PII_LOG_TOTAL_MAX_MB=${PII_LOG_TOTAL_MAX_MB:-10240}
      - PII_LOG_BACKUP_DAYS=${PII_LOG_BACKUP_DAYS:-30}
      - PII_LOG_ROTATE_INTERVAL_SEC=${PII_LOG_ROTATE_INTERVAL_SEC:-30}
      - PII_LOG_ACTIVE_GLOBS=${PII_LOG_ACTIVE_GLOBS:-pii-api-grpc-1.log,pii-api-grpc-2.log,pii-api-grpc-3.log,pii-api-api-http-*.log,pii-api-api-grpc-*.log}
    volumes:
      - ./logs:/logs
    logging: *json-logging
    restart: unless-stopped

  https-proxy:
    profiles: ["https"]
    image: nginx:1.27-alpine
    container_name: xcn-pii-https
    depends_on:
      - api-https
    ports:
      - "${PII_HTTPS_PORT:-28443}:443"
    environment:
      - PII_HTTPS_BACKEND_HOST=api-https
      - PII_HTTPS_SERVER_NAME=${PII_HTTPS_SERVER_NAME:-_}
      - PII_HTTPS_CLIENT_MAX_BODY_SIZE=${PII_HTTPS_CLIENT_MAX_BODY_SIZE:-100m}
      - PII_HTTPS_PROXY_READ_TIMEOUT=${PII_HTTPS_PROXY_READ_TIMEOUT:-300s}
      - PII_HTTPS_PROXY_SEND_TIMEOUT=${PII_HTTPS_PROXY_SEND_TIMEOUT:-300s}
    volumes:
      - ./infra/nginx/https.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./certs:/etc/nginx/certs:ro
    logging: *json-logging
    restart: unless-stopped

volumes:
  hf_cache:
