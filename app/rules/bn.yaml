# BN detector configuration (bank-account-like number).

# Enable/disable this detector.
enabled: true

# External regex dictionary file for bank-specific patterns.
bank_pattern_file: bn_regex.json

# Enable/disable bank_pattern_file usage.
bank_pattern_enabled: false

# Weight applied when bank_pattern_file matches.
bank_pattern_weight: 0.25

# Candidate regex list for account-like numeric tokens.
patterns:
  - name: account_4_4_4_4
    regex: '(?<!\d)\d{4}[-\s]\d{4}[-\s]\d{4}[-\s]\d{4}(?!\d)'
  - name: account_candidate
    regex: '(?<!\d)\d{2,4}[-\s]?\d{2,6}[-\s]?\d{4,7}(?!\d)'
  - name: account_6_2_6
    regex: '(?<!\d)\d{6}[-\s]?\d{2}[-\s]?\d{6}(?!\d)'
  - name: account_3_6_2
    regex: '(?<!\d)\d{3}[-\s]?\d{6}[-\s]?\d{2}(?!\d)'

# Maximum captured match length used by the cursor scanner.
max_match_len: 64

# Non-standard account separators require an explicit account label and must be
# repeated consistently. Only a short label-adjacent window is inspected.
alternate_separator:
  enabled: true
  separator_chars: "&/.'`|"
  max_window_chars: 56
  max_label_value_gap: 8
  digits_length:
    min: 10
    max: 16
  labels:
    - 계좌번호
    - 계좌 번호
    - 입금계좌
    - 입금 계좌
    - 출금계좌
    - 출금 계좌
    - 환불계좌
    - 환불 계좌
    - 은행계좌
    - 은행 계좌
    - bank account
    - account number
    - acct no
  formats:
    - [4, 4, 4, 4]
    - ["2-4", "2-6", "4-7"]
    - [6, 2, 6]
    - [3, 6, 2]

# Post-filter safeguards to reduce overlap/noise.
postfilter:
  enabled: true
  digits_length:
    min: 10
    max: 16
  reject_if_phone_like: true
  reject_if_rrn_like: true
  reject_if_brn_like: true
  boundary_digit_reject: true
  reject_overlap_with:
    - SN
    - MN
    - DN
    - PN
    - BRN
    - EML
