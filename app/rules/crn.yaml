enabled: true
max_match_len: 24
patterns:
  - name: kr_vehicle_registration_number
    expr: "(?:(?:서울|부산|대구|인천|광주|대전|울산|세종|경기|강원|충북|충남|전북|전남|경북|경남|제주)\\s*\\d{1,3}|\\d{2,3})\\s*[가나다라마거너더러머버서어저고노도로모보소오조구누두루무부수우주아바사자배하허호]\\s*\\d{4}"
    verify_regex: "(?<![A-Za-z0-9])(?:(?:서울|부산|대구|인천|광주|대전|울산|세종|경기|강원|충북|충남|전북|전남|경북|경남|제주)\\s*\\d{1,3}|\\d{2,3})\\s*[가나다라마거너더러머버서어저고노도로모보소오조구누두루무부수우주아바사자배하허호]\\s*\\d{4}(?![A-Za-z0-9])"
    regex: "(?<![A-Za-z0-9])(?:(?:서울|부산|대구|인천|광주|대전|울산|세종|경기|강원|충북|충남|전북|전남|경북|경남|제주)\\s*\\d{1,3}|\\d{2,3})\\s*[가나다라마거너더러머버서어저고노도로모보소오조구누두루무부수우주아바사자배하허호]\\s*\\d{4}(?![A-Za-z0-9])"
