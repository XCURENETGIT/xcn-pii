# Provider credentials that do not have a sufficiently safe prefix of their
# own are accepted only with exact provider-defined labels.
enabled: true
max_match_len: 4096
prefilter_any: [aws_, accountkey, azure_storage, sharedaccesskey]
patterns:
  - name: aws_secret_access_key
    detected_by: aws_secret_access_key
    prefilter_any: [aws_secret_access_key, aws_secret_key]
    regex: '(?<![A-Za-z0-9])["''`*_~]{0,3}(?:AWS_SECRET_ACCESS_KEY|AWS_SECRET_KEY)["''`*_~]{0,3}(?![A-Za-z0-9])(?:[ \t\r\n]{1,8}|\s*(?:[:=|]|=>|->)\s*)["''`*_~]{0,3}(?P<value>[A-Za-z0-9/+=]{40})["''`*_~]{0,3}'
    flags:
      ignorecase: true
    min_entropy: 3.0
    validator: secret_value
  - name: aws_session_token
    detected_by: aws_session_token
    prefilter_any: [aws_session_token, aws_security_token]
    regex: '(?<![A-Za-z0-9])["''`*_~]{0,3}(?:AWS_SESSION_TOKEN|AWS_SECURITY_TOKEN)["''`*_~]{0,3}(?![A-Za-z0-9])(?:[ \t\r\n]{1,8}|\s*(?:[:=|]|=>|->)\s*)["''`*_~]{0,3}(?P<value>[A-Za-z0-9/+=._-]{16,4096})["''`*_~]{0,3}'
    flags:
      ignorecase: true
    min_entropy: 3.0
    validator: secret_value
  - name: azure_storage_account_key
    detected_by: azure_storage_account_key
    prefilter_any: [accountkey, azure_storage_key, azure_storage_account_key, sharedaccesskey]
    regex: '(?<![A-Za-z0-9])["''`*_~]{0,3}(?:AccountKey|SharedAccessKey|AZURE_STORAGE_KEY|AZURE_STORAGE_ACCOUNT_KEY)["''`*_~]{0,3}(?![A-Za-z0-9])(?:[ \t\r\n]{1,8}|\s*(?:[:=|]|=>|->)\s*)["''`*_~]{0,3}(?P<value>[A-Za-z0-9+/]{40,256}={0,2})["''`*_~]{0,3}'
    min_entropy: 3.0
    validator: secret_value
