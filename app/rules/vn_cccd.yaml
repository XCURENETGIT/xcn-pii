# Vietnam Citizen Identity Card number (CCCD / Căn Cước Công Dân).

enabled: true

patterns:
  - name: vietnam_cccd_12_digits
    # 12 digits:
    # - 1~3: province/city code
    # - 4: gender + birth century code
    # - 5~6: birth year last two digits
    # - 7~12: serial number
    expr: '(?:001|002|004|006|008|010|011|012|014|015|017|019|020|022|024|025|026|027|030|031|033|034|035|036|037|038|040|042|044|045|046|048|049|051|052|054|056|058|060|062|064|066|067|068|070|072|074|075|077|079|080|082|083|084|086|087|089|091|092|093|094|095|096)[0-9]{9}'
    regex: '(?<!\d)(?:001|002|004|006|008|010|011|012|014|015|017|019|020|022|024|025|026|027|030|031|033|034|035|036|037|038|040|042|044|045|046|048|049|051|052|054|056|058|060|062|064|066|067|068|070|072|074|075|077|079|080|082|083|084|086|087|089|091|092|093|094|095|096)[0-9]{9}(?!\d)'
    verify_regex: '(?<!\d)(?:001|002|004|006|008|010|011|012|014|015|017|019|020|022|024|025|026|027|030|031|033|034|035|036|037|038|040|042|044|045|046|048|049|051|052|054|056|058|060|062|064|066|067|068|070|072|074|075|077|079|080|082|083|084|086|087|089|091|092|093|094|095|096)[0-9]{9}(?!\d)'
    flags:
      utf8: false
      ucp: false

max_match_len: 16
