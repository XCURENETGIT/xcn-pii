# Vietnam mobile phone number.

enabled: true

patterns:
  - name: vietnam_mobile_phone
    # 10 digits with known mobile prefixes. Separators between 3-3-4 groups
    # are accepted for copied text: 0981234567 / 098-123-4567 / 098 123 4567.
    expr: '(?:032|033|034|035|036|037|038|039|086|096|097|098|081|082|083|084|085|088|091|094|070|076|077|078|079|089|090|093|052|055|056|058|092|059|087|099)[-.\s]?[0-9]{3}[-.\s]?[0-9]{4}'
    regex: '(?<!\d)(?:032|033|034|035|036|037|038|039|086|096|097|098|081|082|083|084|085|088|091|094|070|076|077|078|079|089|090|093|052|055|056|058|092|059|087|099)[-.\s]?[0-9]{3}[-.\s]?[0-9]{4}(?!\d)'
    verify_regex: '(?<!\d)(?:032|033|034|035|036|037|038|039|086|096|097|098|081|082|083|084|085|088|091|094|070|076|077|078|079|089|090|093|052|055|056|058|092|059|087|099)[-.\s]?[0-9]{3}[-.\s]?[0-9]{4}(?!\d)'
    flags:
      utf8: false
      ucp: false

max_match_len: 20
