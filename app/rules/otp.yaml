# One-time password / verification code. A numeric value is accepted only when
# an explicit OTP or verification-code label is nearby.
enabled: true
max_match_len: 31
patterns:
  - name: otp_label_before_value
    detected_by: otp_context_before
    prefilter_any: [otp, totp, hotp, mfa, 2fa, one-time, one_time, "one time", single-use, verification, authentication, security, confirmation, login, sign-in, sign_in, "sign in", factor, 인증, 확인, 보안, 본인, 로그인, 접속, 다단계, 이중, 2차, 일회용]
    regex: >-
      (?:
        \b(?:otp|totp|hotp|mfa|2fa)[\s_.-]*(?:code|number|pin|password|passcode)?\b
        |\b(?:one[\s_.-]*time|single[\s_.-]*use)[\s_.-]*(?:password|passcode|code|pin)\b
        |\b(?:verification|authentication|security|confirmation|login|sign[\s_.-]*in|multi[\s_.-]*factor|two[\s_.-]*factor)[\s_.-]*(?:code|number|pin|passcode)\b
        |(?:OTP|TOTP|HOTP|MFA|2FA)\s*(?:번호|코드|PIN|비밀번호)?
        |(?:인증|확인|보안|본인\s*확인|로그인|접속|다단계\s*인증|이중\s*인증|2차\s*인증)\s*(?:번호|코드|PIN)
        |일회용\s*(?:비밀번호|암호|번호|코드|PIN)
      )
      \s*(?:(?:은|는|이|가|입니다|입니다만|is|equals?|value(?:\s+is)?|code(?:\s+is)?|[:=\-#>])\s*)*
      (?:["'\[(]\s*)?(?<!\d)(?P<value>\d{4,8})(?!\d)(?:\s*["'\])])?
    flags:
      ignorecase: true
      verbose: true
    min_length: 4
    max_length: 8
  - name: otp_value_before_label
    detected_by: otp_context_after
    prefilter_any: [otp, totp, hotp, mfa, 2fa, one-time, one_time, "one time", single-use, verification, authentication, security, confirmation, login, sign-in, sign_in, "sign in", factor, 인증, 확인, 보안, 본인, 로그인, 접속, 다단계, 이중, 2차, 일회용]
    regex: >-
      (?<!\d)(?P<value>\d{4,8})(?!\d)
      \s*(?:(?:은|는|이|가|번은|번이)\s*|(?:is\s+(?:(?:your|the)\s+)?|equals?\s+))
      (?:
        \b(?:otp|totp|hotp|mfa|2fa)[\s_.-]*(?:code|number|pin|password|passcode)?\b
        |\b(?:one[\s_.-]*time|single[\s_.-]*use)[\s_.-]*(?:password|passcode|code|pin)\b
        |\b(?:verification|authentication|security|confirmation|login|sign[\s_.-]*in|multi[\s_.-]*factor|two[\s_.-]*factor)[\s_.-]*(?:code|number|pin|passcode)\b
        |(?:OTP|TOTP|HOTP|MFA|2FA)\s*(?:번호|코드|PIN|비밀번호)?
        |(?:인증|확인|보안|본인\s*확인|로그인|접속|다단계\s*인증|이중\s*인증|2차\s*인증)\s*(?:번호|코드|PIN)
        |일회용\s*(?:비밀번호|암호|번호|코드|PIN)
      )
      (?:\s*(?:입니다|입니다\.|입니다만|입니다요))?
    flags:
      ignorecase: true
      verbose: true
    min_length: 4
    max_length: 8
  - name: otp_fragmented_digits
    detected_by: otp_fragmented_digits
    prefilter_any: [otp, totp, hotp, mfa, 2fa, verification, authentication, security, confirmation, 인증, 확인, 보안, 본인, 로그인, 일회용]
    regex: >-
      (?:
        \b(?:otp|totp|hotp|mfa|2fa)[\s_.-]*(?:code|number|pin|password|passcode)?\b
        |\b(?:verification|authentication|security|confirmation|login)[\s_.-]*(?:code|number|pin|passcode)\b
        |(?:OTP|TOTP|HOTP|MFA|2FA)\s*(?:번호|코드|PIN|비밀번호)?
        |(?:인증|확인|보안|본인\s*확인|로그인|일회용)\s*(?:번호|코드|PIN|비밀번호)?
      )
      ["'`*_~]{0,3}\s*(?:(?:은|는|이|가|is|equals?|[:=|]|=>|->)\s*)*
      ["'`*_~]{0,3}(?P<value>\d(?:[\s&/.'`|_-]{1,3}\d){3,7})["'`*_~]{0,3}
    flags:
      ignorecase: true
      verbose: true
    validator: fragmented_otp
