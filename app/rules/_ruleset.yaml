# Pipeline profile name.
ruleset_name: default
# Detection and post-processing order.
steps:
  - dn
  - SSN
  - sn
  - pn
  - vn_pn
  - EML
  - cn
  - mn
  - vn_mn
  - vn_cccd
  - vn_tin
  - vn_si
  - brn
  - bn
  - an
  - post_mn
  - post_bn
  - post_context
# Rule document file mapping used by the engine loader.
rule_files:
  sn: sn.yaml
  SSN: ssn.yaml
  dn: dn.yaml
  pn: pn.yaml
  vn_pn: vn_pn.yaml
  mn: mn.yaml
  vn_mn: vn_mn.yaml
  vn_cccd: vn_cccd.yaml
  vn_tin: vn_tin.yaml
  vn_si: vn_si.yaml
  brn: brn.yaml
  bn: bn.yaml
  an: an.yaml
  cn: cn.yaml
  EML: eml.yaml
  context: context.yaml
# Common engine defaults.
defaults:
  max_results_per_type: 500
  max_match_len_default: 240
