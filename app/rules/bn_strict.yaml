# BN strict detector configuration.

# Enable/disable this detector.
enabled: true

# Enable/disable bank_pattern_file usage (if configured via context/per-type).
bank_pattern_enabled: false

# Strict candidate regex requiring separators.
patterns:
  - name: account_candidate_with_sep
    regex: '(?<!\d)\d{2,4}(?:[-\s]+)\d{2,6}(?:[-\s]+)\d{4,7}(?!\d)'
  - name: account_6_2_6_with_sep
    regex: '(?<!\d)\d{6}(?:[-\s]+)\d{2}(?:[-\s]+)\d{6}(?!\d)'

# Maximum captured match length used by the cursor scanner.
max_match_len: 64

# Strict mode keeps the ordinary 14-digit cap. A 16-digit account is accepted
# only through this explicit-label, bounded, consistently-separated path.
alternate_separator:
  enabled: true
  separator_chars: "&/.'`|"
  max_window_chars: 56
  max_label_value_gap: 8
  digits_length:
    min: 11
    max: 16
  labels:
    - 계좌번호
    - 계좌 번호
    - 입금계좌
    - 입금 계좌
    - 출금계좌
    - 출금 계좌
    - 환불계좌
    - 환불 계좌
    - 은행계좌
    - 은행 계좌
    - bank account
    - account number
    - acct no
  formats:
    - [4, 4, 4, 4]
    - ["2-4", "2-6", "4-7"]
    - [6, 2, 6]
    - [3, 6, 2]

# Post-filter safeguards (strict profile).
postfilter:
  enabled: true
  digits_length:
    min: 11
    max: 14
  reject_if_phone_like: true
  reject_if_brn_like: true
  boundary_digit_reject: true
  reject_overlap_with:
    - SN
    - MN
    - DN
    - PN
    - BRN
    - CN
    - EML
