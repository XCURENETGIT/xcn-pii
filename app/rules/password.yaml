# Passwords cannot be inferred from arbitrary strings. Only values explicitly
# assigned to a password/passphrase label are returned.
enabled: true
max_match_len: 256
patterns:
  - name: password_double_quoted
    detected_by: labeled_password
    regex: >-
      (?<![A-Za-z0-9])(?:password|passwd|pwd|passphrase|비밀번호|암호)(?![A-Za-z0-9])\s*(?:(?:은|는)\s*|[:=]\s*)"(?P<value>[^"\r\n]{1,256})"
    flags:
      ignorecase: true
  - name: password_single_quoted
    detected_by: labeled_password
    regex: >-
      (?<![A-Za-z0-9])(?:password|passwd|pwd|passphrase|비밀번호|암호)(?![A-Za-z0-9])\s*(?:(?:은|는)\s*|[:=]\s*)'(?P<value>[^'\r\n]{1,256})'
    flags:
      ignorecase: true
  - name: password_unquoted
    detected_by: labeled_password
    regex: >-
      (?<![A-Za-z0-9])(?:password|passwd|pwd|passphrase|비밀번호|암호)(?![A-Za-z0-9])\s*(?:(?:은|는)\s*|[:=]\s*)(?P<value>[^\s,;"'<>]{1,256})
    flags:
      ignorecase: true
