# Passwords cannot be inferred from arbitrary strings. Only values explicitly
# assigned to a password/passphrase label are returned.
enabled: true
max_match_len: 256
patterns:
  - name: password_double_quoted
    detected_by: labeled_password
    prefilter_any: [password, passwd, pwd, passphrase, dbpass, userpass, 비밀번호, 암호]
    regex: >-
      (?<![A-Za-z0-9])["']?(?:password|passwd|pwd|passphrase|(?:db|database|user|account|admin|root|login|service|current|new|old|temp|temporary|default)[\s_.-]*(?:password|passwd|pwd)|비밀번호|암호|(?:로그인|계정|사용자|관리자|루트|DB|데이터베이스|서비스|현재|기존|새|신규|임시|초기)\s*(?:비밀번호|암호))["']?(?![A-Za-z0-9])\s*(?:(?:은|는|이|가)\s*(?:다음과\s*같습니다?)?\s*[:=]?\s*|(?:is|equals?)\s*|[:=]\s*|=>\s*)"(?P<value>[^"\r\n]{1,256})"
    flags:
      ignorecase: true
  - name: password_single_quoted
    detected_by: labeled_password
    prefilter_any: [password, passwd, pwd, passphrase, dbpass, userpass, 비밀번호, 암호]
    regex: >-
      (?<![A-Za-z0-9])["']?(?:password|passwd|pwd|passphrase|(?:db|database|user|account|admin|root|login|service|current|new|old|temp|temporary|default)[\s_.-]*(?:password|passwd|pwd)|비밀번호|암호|(?:로그인|계정|사용자|관리자|루트|DB|데이터베이스|서비스|현재|기존|새|신규|임시|초기)\s*(?:비밀번호|암호))["']?(?![A-Za-z0-9])\s*(?:(?:은|는|이|가)\s*(?:다음과\s*같습니다?)?\s*[:=]?\s*|(?:is|equals?)\s*|[:=]\s*|=>\s*)'(?P<value>[^'\r\n]{1,256})'
    flags:
      ignorecase: true
  - name: password_unquoted
    detected_by: labeled_password
    prefilter_any: [password, passwd, pwd, passphrase, dbpass, userpass, 비밀번호, 암호]
    regex: >-
      (?<![A-Za-z0-9])["']?(?:password|passwd|pwd|passphrase|(?:db|database|user|account|admin|root|login|service|current|new|old|temp|temporary|default)[\s_.-]*(?:password|passwd|pwd)|비밀번호|암호|(?:로그인|계정|사용자|관리자|루트|DB|데이터베이스|서비스|현재|기존|새|신규|임시|초기)\s*(?:비밀번호|암호))["']?(?![A-Za-z0-9])\s*(?:(?:은|는|이|가)\s*(?:다음과\s*같습니다?)?\s*[:=]?\s*|(?:is|equals?)\s*|[:=]\s*|=>\s*)(?P<value>[^\s,;"'<>]{1,256})
    flags:
      ignorecase: true
  - name: password_cli_double_quoted
    detected_by: password_cli_argument
    prefilter_any: [--password, --passwd, --pwd]
    regex: '(?<![A-Za-z0-9])--(?:password|passwd|pwd)\s+"(?P<value>[^"\r\n]{1,256})"'
    flags:
      ignorecase: true
  - name: password_cli_single_quoted
    detected_by: password_cli_argument
    prefilter_any: [--password, --passwd, --pwd]
    regex: >-
      (?<![A-Za-z0-9])--(?:password|passwd|pwd)\s+'(?P<value>[^'\r\n]{1,256})'
    flags:
      ignorecase: true
  - name: password_cli_unquoted
    detected_by: password_cli_argument
    prefilter_any: [--password, --passwd, --pwd]
    regex: >-
      (?<![A-Za-z0-9])--(?:password|passwd|pwd)\s+(?P<value>[^\s,;"'<>]{1,256})
    flags:
      ignorecase: true
  - name: password_xml_element
    detected_by: password_xml_element
    prefilter_any: [<password, <passwd, <pwd]
    regex: '<\s*(?:password|passwd|pwd)\s*>\s*(?P<value>[^<\r\n]{1,256}?)\s*<\s*/\s*(?:password|passwd|pwd)\s*>'
    flags:
      ignorecase: true
  - name: password_korean_instruction
    detected_by: password_instruction
    prefilter_any: [비밀번호, 암호]
    regex: >-
      (?:비밀번호|암호)(?:를|을)\s*(?:입력|사용|설정|변경)(?:해\s*주세요|하세요|하십시오)?\s*[:=]\s*["']?(?P<value>[^\s,;"'<>]{1,256})["']?
