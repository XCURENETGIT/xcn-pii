        - "익명화"
      hybrid:
        name_pii_row_repeat_min_count: 1
        label_patterns:
          - "(?i)\\bSN\\b|\\bRRN\\b|resident\\s+(?:registration\\s+)?number|korean\\s+resident\\s+registration\\s+number|national\\s+identification\\s+number|주민\\s*등록\\s*(?:증\\s*)?번호|주민\\s*등록|주민\\s*번호|주번"
