# Long-lived HOTP/TOTP seed material, separate from short one-time OTP values.
enabled: true
max_match_len: 128
prefilter_any: [otpauth, totp, hotp, mfa, 2fa, authenticator, 인증앱, 인증기]
patterns:
  - name: otpauth_secret
    detected_by: otpauth_secret
    prefilter_any: [otpauth://]
    regex: 'otpauth://[^\s<>"'']{0,2048}?[?&]secret=(?P<value>[A-Z2-7]{16,128}={0,8})'
    flags:
      ignorecase: true
    validator: base32_secret
  - name: labeled_mfa_secret
    detected_by: labeled_mfa_secret
    prefilter_any: [totp_secret, hotp_secret, mfa_secret, 2fa_secret, authenticator_secret, otp_secret, otp_seed, totp_seed, hotp_seed, 인증앱, 인증기, 비밀키]
    regex: '(?<![A-Za-z0-9])["''`*_~]{0,3}(?:(?:TOTP|HOTP|MFA|2FA|OTP|AUTHENTICATOR)[\s_.-]*(?:SECRET|SEED|KEY)|(?:인증\s*앱|인증기|OTP|MFA|2FA)\s*(?:비밀키|시드|공유키))["''`*_~]{0,3}(?![A-Za-z0-9])(?:[ \t\r\n]{1,8}|\s*(?:[:=|]|=>|->)\s*)["''`*_~]{0,3}(?P<value>[A-Z2-7](?:[ -]?[A-Z2-7]){15,127}={0,8})["''`*_~]{0,3}'
    flags:
      ignorecase: true
    validator: base32_secret
