global
    log stdout format raw local0
    maxconn 4096
    spread-checks 5

defaults
    log global
    mode http
    timeout connect 5s
    timeout client  5m
    timeout server  5m
    option httplog
    option http-keep-alive

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 10s

frontend grpc_front
    bind *:50051 proto h2
    default_backend grpc_back

backend grpc_back
    balance roundrobin
    option tcp-check
    default-server inter 1s fall 2 rise 1 slowstart 3s
    server pii1 api-grpc-1:50051 proto h2 check resolvers docker init-addr libc,none resolve-prefer ipv4
    server pii2 api-grpc-2:50051 proto h2 check resolvers docker init-addr libc,none resolve-prefer ipv4
    server pii3 api-grpc-3:50051 proto h2 check resolvers docker init-addr libc,none resolve-prefer ipv4
