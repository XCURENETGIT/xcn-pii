global
    log stdout format raw local0
    maxconn 4096
    spread-checks 5

defaults
    log global
    mode http
    timeout connect 5s
    timeout client  5m
    timeout server  5m
    option httplog
    option dontlog-normal
    option http-keep-alive

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 10s

frontend grpc_front
    bind *:50051 proto h2
    default_backend grpc_back

backend grpc_back
    balance leastconn
    http-reuse always
    option tcp-check
    default-server inter 1s fall 2 rise 1 slowstart 3s
    server-template pii 1-3 api-grpc:50051 proto h2 check resolvers docker init-addr none resolve-prefer ipv4
